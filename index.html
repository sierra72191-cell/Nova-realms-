<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVA REALMS</title>
    <style>
        body {
            margin: 0;
            font-family: 'Courier New', monospace;
            background: #0a0a0a;
            color: #ff8800;
            text-align: center;
            overflow: hidden;
        }
        .header {
            font-size: 3.8em;
            font-weight: bold;
            letter-spacing: 6px;
            text-shadow: 0 0 25px #ff6600;
            margin: 30px 0 10px;
            color: #ff8800;
        }
        .subheader {
            font-size: 1.2em;
            letter-spacing: 4px;
            opacity: 0.9;
            color: #ffaa44;
        }
        .days {
            background: rgba(255, 102, 0, 0.15);
            border: 2px solid #ff6600;
            color: #ffdd88;
            padding: 12px 30px;
            border-radius: 50px;
            display: inline-block;
            font-size: 1.6em;
            margin: 15px 0;
            box-shadow: 0 0 20px rgba(255, 102, 0, 0.6);
        }
        .stats {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin: 25px;
            flex-wrap: wrap;
        }
        .stat-card {
            background: rgba(255, 102, 0, 0.1);
            border: 1px solid #ff6600;
            border-radius: 12px;
            padding: 18px 30px;
            min-width: 150px;
            box-shadow: 0 0 20px rgba(255, 102, 0, 0.4);
        }
        .value {
            font-size: 2.4em;
            font-weight: bold;
            color: #ffdd88;
        }
        .grid-hardened {
            font-size: 3em;
            margin: 40px 0;
            text-shadow: 0 0 40px #ff8800;
            letter-spacing: 8px;
            color: #ff6600;
        }
        .map-container {
            margin: 20px auto;
            max-width: 920px;
            border: 3px solid #ff6600;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(255, 102, 0, 0.5);
        }
    </style>
</head>
<body>
    <div class="header">NOVA REALMS</div>
    <div class="subheader">REAL-TIME ENVIRONMENTAL TELEMETRY</div>

    <div class="days">
        <strong>DAYS SINCE GENESIS: 298</strong>
    </div>
    
    <div style="margin: 10px 0; font-size: 1.15em; opacity: 0.9;">
        19:27 — June Sunday 14th
    </div>

    <div class="stats">
        <div class="stat-card">
            <div>🌡️ REAL-FEEL</div>
            <div class="value">85°F</div>
        </div>
        <div class="stat-card">
            <div>💧 HUMIDITY</div>
            <div class="value">69%</div>
        </div>
        <div class="stat-card">
            <div>🌬️ WIND</div>
            <div class="value">6mph</div>
        </div>
    </div>

    <div class="grid-hardened">GRID<br>HARDENED</div>

    <!-- Map section placeholder -->
    <div class="map-container">
        <!-- Your existing map code / Leaflet embed goes here -->
    </div>

    <script>
        console.log("%cNOVA REALM GRID HARDENED - BLACK + ORANGE PROTOCOL ACTIVE", "color: #ff8800; font-size: 16px;");
    </script>
</body>
</html>
